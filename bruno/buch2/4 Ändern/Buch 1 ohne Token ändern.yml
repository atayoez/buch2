info:
  name: Buch 1 ohne Token ändern
  type: http
  seq: 6

http:
  method: PUT
  url: "{{booksUrl}}/:id"
  headers:
    - name: If-Match
      value: '{{ETAG}}'
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "title": "Geändert mit PUT"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/problem\+json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
