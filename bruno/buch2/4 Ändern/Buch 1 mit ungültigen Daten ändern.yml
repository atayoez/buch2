info:
  name: Buch 1 mit ungültigen Daten ändern
  type: http
  seq: 5

http:
  method: PUT
  url: "{{booksUrl}}/:id"
  headers:
    - name: If-Match
      value: '{{ETAG}}'
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "title": "",
        "gibtEsNicht": true
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/problem\+json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
