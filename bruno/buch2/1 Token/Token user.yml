info:
  name: Token user
  type: http
  seq: 2

http:
  method: POST
  url: "{{tokenUrl}}"
  body:
    type: json
    data: |-
      {
        "username": "user",
        "password": "p"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        // Token ohne die Rolle admin merken
        bru.setVar('TOKEN_USER', res.getBody().access_token);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.access_token
      operator: matches
      value: .+\..+\..+
    - expression: res.body.expires_in
      operator: eq
      value: "1800"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
