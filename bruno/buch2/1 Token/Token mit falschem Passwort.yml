info:
  name: Token mit falschem Passwort
  type: http
  seq: 3

http:
  method: POST
  url: "{{tokenUrl}}"
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "FALSCH"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/problem\+json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
