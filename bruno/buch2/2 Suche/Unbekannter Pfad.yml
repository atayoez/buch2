info:
  name: Unbekannter Pfad
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/gibt-es-nicht"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/problem\+json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
