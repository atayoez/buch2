info:
  name: Nicht-vorhandenes Buch 999999
  type: http
  seq: 5

http:
  method: GET
  url: "{{booksUrl}}/:id"
  params:
    - name: id
      value: "999999"
      type: path

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/problem\+json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
