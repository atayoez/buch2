info:
  name: Alle Bücher
  type: http
  seq: 1

http:
  method: GET
  url: "{{booksUrl}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
